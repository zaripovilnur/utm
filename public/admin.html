<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTM-реестр — админ</title>
<script src="/vendor/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F6F3;
    --surface:#FFFFFF;
    --ink:#17181B;
    --ink-soft:#6D6F78;
    --ink-faint:#9C9EA6;
    --line:#E7E6E0;
    --line-soft:#F0EFEA;
    --accent:#3452D9;
    --accent-hover:#2A42B8;
    --accent-soft:#ECF0FD;
    --active:#1F8A5F;
    --active-soft:#E5F4ED;
    --danger:#C4432B;
    --danger-soft:#FBEAE5;
    --shadow-modal: 0 20px 60px rgba(20,20,25,0.18), 0 2px 8px rgba(20,20,25,0.06);
    --mono: "SFMono-Regular","IBM Plex Mono",Consolas,"Liberation Mono",Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{max-width:1440px;margin:0 auto;padding:36px 24px 72px;}
  button,input{font-family:var(--sans);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:26px;}
  .logo{width:36px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:600;letter-spacing:-0.02em;}
  .top h1{font-size:20px;font-weight:600;margin:0 0 3px;letter-spacing:-0.01em;}
  .top p{margin:0;color:var(--ink-soft);font-size:13px;}

  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-md);padding:9px 15px;font-size:13.5px;font-weight:500;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .12s ease, border-color .12s ease, transform .05s ease;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:var(--line-soft);}
  .icon-btn{border:none;background:none;color:var(--ink-faint);padding:5px;border-radius:7px;display:inline-flex;cursor:pointer;}
  .icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-modal);}

  .login-card{max-width:360px;margin:10vh auto 0;padding:28px;}
  .login-card h2{font-size:16px;font-weight:600;margin:0 0 18px;}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:0 0 5px;font-weight:500;}
  input[type=password]{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;font-family:var(--sans);font-size:13.5px;background:var(--surface);color:var(--ink);}
  input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input.field-invalid{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
  .err{font-size:12px;color:var(--danger);margin:8px 0 0;display:none;}
  .login-card .btn{width:100%;justify-content:center;margin-top:14px;}

  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .panel-actions{display:flex;gap:8px;}

  .table-card{overflow:hidden;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;min-width:900px;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-weight:500;color:var(--ink-faint);font-size:11px;border-bottom:1px solid var(--line);padding:12px 14px;white-space:nowrap;background:#FCFCFB;}
  tbody td{border-bottom:1px solid var(--line-soft);padding:13px 14px;vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFBF9;}
  .link-url{color:var(--ink-soft);font-family:var(--mono);font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px;display:block;}
  .badge-company{display:inline-block;background:var(--active-soft);color:var(--active);border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:var(--mono);}
  .badge-source{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:var(--mono);}
  .tag-pair{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  .tag-pair .med{color:var(--ink-faint);margin-left:8px;}
  .empty-state{padding:48px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s ease, transform .15s ease;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,0.2);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  [hidden]{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">U</div>
    <div>
      <h1>UTM-реестр — админ</h1>
      <p>Экспорт и удаление меток.</p>
    </div>
  </div>

  <div class="card login-card" id="login-view">
    <h2>Вход</h2>
    <label for="admin-password">Пароль администратора</label>
    <input type="password" id="admin-password" autocomplete="current-password">
    <div class="err" id="login-error">Неверный пароль</div>
    <button class="btn btn-primary" id="btn-login">Войти</button>
  </div>

  <div id="admin-view" hidden>
    <div class="panel-head">
      <span id="admin-count" style="color:var(--ink-soft);font-size:13px;"></span>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="btn-export-excel">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2v8.5M8 10.5L5 7.5M8 10.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11.5V13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Экспорт в Excel
        </button>
        <button class="btn btn-ghost" id="btn-logout">Выйти</button>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Ссылка</th>
              <th>Компания</th>
              <th>Источник / канал</th>
              <th>Кампания</th>
              <th>Создано</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="admin-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="admin-empty" hidden>Реестр пока пуст</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1700);
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

let registry = [];

function showLogin(){
  document.getElementById('login-view').hidden = false;
  document.getElementById('admin-view').hidden = true;
}

function showAdmin(){
  document.getElementById('login-view').hidden = true;
  document.getElementById('admin-view').hidden = false;
}

async function checkSession(){
  try{
    const r = await fetch('/api/admin/session');
    const data = await r.json();
    if(data.authenticated){
      showAdmin();
      await loadRegistry();
    }else{
      showLogin();
    }
  }catch(e){
    showLogin();
  }
}

async function login(){
  const input = document.getElementById('admin-password');
  const errBox = document.getElementById('login-error');
  input.classList.remove('field-invalid');
  errBox.style.display = 'none';
  const password = input.value;
  if(!password){
    input.classList.add('field-invalid');
    errBox.textContent = 'Введите пароль';
    errBox.style.display = 'block';
    return;
  }
  try{
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password })
    });
    if(!r.ok){
      const data = await r.json().catch(()=>({}));
      input.classList.add('field-invalid');
      errBox.textContent = data.error || 'Неверный пароль';
      errBox.style.display = 'block';
      return;
    }
    input.value = '';
    showAdmin();
    await loadRegistry();
  }catch(e){
    errBox.textContent = 'Не удалось подключиться к серверу';
    errBox.style.display = 'block';
  }
}

async function logout(){
  await fetch('/api/admin/logout', { method: 'POST' }).catch(()=>{});
  showLogin();
}

async function loadRegistry(){
  try{
    const r = await fetch('/api/registry');
    registry = r.ok ? await r.json() : [];
  }catch(e){
    registry = [];
  }
  renderRegistry();
}

function renderRegistry(){
  const rows = [...registry].sort((a,b)=> (b.createdAtRaw||0) - (a.createdAtRaw||0));
  document.getElementById('admin-count').textContent = `Меток в реестре: ${rows.length}`;
  const body = document.getElementById('admin-body');
  const emptyState = document.getElementById('admin-empty');
  const table = document.querySelector('#admin-view table');
  body.innerHTML = '';
  table.style.display = rows.length ? 'table' : 'none';
  emptyState.hidden = rows.length > 0;

  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="link-url" title="${escapeHtml(r.fullLink)}">${escapeHtml(r.fullLink)}</span></td>
      <td>${r.company ? `<span class="badge-company">${escapeHtml(r.company)}</span>` : '—'}</td>
      <td class="tag-pair"><span class="badge-source">${escapeHtml(r.source)}</span><span class="med">${escapeHtml(r.medium)}</span></td>
      <td>${escapeHtml(r.campaign)}</td>
      <td style="color:var(--ink-soft);">${escapeHtml(r.createdAt)}</td>
      <td>
        <button class="icon-btn danger del-row" title="Удалить">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M6 7.3v4M10 7.3v4M4 4.5l.6 8a1.4 1.4 0 0 0 1.4 1.3h4a1.4 1.4 0 0 0 1.4-1.3l.6-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </td>
    `;
    tr.querySelector('.del-row').onclick = async ()=>{
      if(!confirm('Удалить эту метку из реестра?')) return;
      const resp = await fetch('/api/admin/registry/' + encodeURIComponent(r.id), { method: 'DELETE' });
      if(resp.status === 401){ showToast('Сессия истекла — войдите снова'); showLogin(); return; }
      if(!resp.ok){ showToast('Не удалось удалить метку'); return; }
      registry = registry.filter(x=>x.id!==r.id);
      renderRegistry();
      showToast('Метка удалена');
    };
    body.appendChild(tr);
  });
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('Не удалось загрузить модуль экспорта — проверьте подключение к интернету');
    return;
  }
  if(!registry.length){
    showToast('Нечего экспортировать — список пуст');
    return;
  }
  const data = [...registry].sort((a,b)=> (b.createdAtRaw||0) - (a.createdAtRaw||0)).map(r=>({
    'Компания': r.company || '',
    'utm_source': r.source,
    'utm_medium': r.medium,
    'utm_campaign': r.campaign,
    'utm_term': r.term || '',
    'utm_content': r.content || '',
    'Назначение': r.purpose || '',
    'Ссылка': r.fullLink,
    'Создано': r.createdAt
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:10},{wch:14},{wch:12},{wch:26},{wch:16},{wch:16},{wch:32},{wch:55},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'UTM-реестр');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `utm-registry-${stamp}.xlsx`);
}

document.getElementById('btn-login').onclick = login;
document.getElementById('admin-password').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') login(); });
document.getElementById('btn-logout').onclick = logout;
document.getElementById('btn-export-excel').onclick = exportToExcel;

checkSession();
</script>
</body>
</html>
