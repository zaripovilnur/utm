name: Deploy to server

on:
  push:
    branches: [ claude/utm-registry-webapp-qfeudg ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/utm
            git pull origin claude/utm-registry-webapp-qfeudg
            npm install
            pm2 restart utm-registry
